apiVersion: v1
kind: Service
metadata:
  name: ai-devops-public-demo
  namespace: ai-devops
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: ai-devops-public-demo
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
