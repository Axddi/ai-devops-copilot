apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-devops-api
  namespace: ai-devops
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-devops-api-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-devops-api-pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-devops-api-pod-reader
subjects:
  - kind: ServiceAccount
    name: ai-devops-api
    namespace: ai-devops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-devops-api-incident-reader
  namespace: ai-devops
rules:
  - apiGroups: [""]
    resources: ["events", "pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-devops-api-incident-reader
  namespace: ai-devops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-devops-api-incident-reader
subjects:
  - kind: ServiceAccount
    name: ai-devops-api
    namespace: ai-devops
