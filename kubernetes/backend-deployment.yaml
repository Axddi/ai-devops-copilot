apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-devops-api
  namespace: ai-devops

spec:
  replicas: 1
  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app: ai-devops-api

  template:
    metadata:
      labels:
        app: ai-devops-api

    spec:
      serviceAccountName: ai-devops-api
      automountServiceAccountToken: true
      containers:
        - name: api

          image: 122610523913.dkr.ecr.ap-south-1.amazonaws.com/ai-devops-api:demo-20261008-public-demo-v2

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-devops-secrets
                  key: GROQ_API_KEY
                  optional: true
            - name: GROQ_MODEL
              value: openai/gpt-oss-20b
            - name: COGNITO_ISSUER
              value: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_A6sKQ52Wj
            - name: COGNITO_CLIENT_ID
              value: 7j18lkj091ptj4ivke9t7d8c3a
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-devops-db-secrets
                  key: DATABASE_URL
            - name: MYSQL_SSL_CA
              value: /etc/ssl/certs/rds-ca-bundle.pem
            - name: DASHBOARD_NAMESPACE
              value: ai-devops
            - name: DASHBOARD_CACHE_TTL_SECONDS
              value: "15"
            - name: DASHBOARD_TIMEOUT_SECONDS
              value: "4"
            - name: PROMETHEUS_URL
              value: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
            - name: PROMETHEUS_TIMEOUT_SECONDS
              value: "2"
            - name: KUBERNETES_REQUEST_TIMEOUT_SECONDS
              value: "3"

          startupProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"

            limits:
              cpu: "500m"
              memory: "384Mi"
