apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress
spec:
  containers:
    - name: cpu-stress
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args: ["while true; do :; done"]
      resources:
        requests:
          cpu: "100m"
          memory: "16Mi"
        limits:
          cpu: "250m"
          memory: "64Mi"